<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - NewsBlog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=1600&q=80') center/cover no-repeat; position: relative; }
        body::before { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(6px); z-index: 0; }
        .login-container { position: relative; z-index: 1; background: rgba(255,255,255,0.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 32px; padding: 48px 40px; width: 100%; max-width: 400px; box-shadow: 0 30px 60px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08); transition: transform 0.3s ease; }
        .login-container:hover { transform: translateY(-4px); }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header h1 { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        .login-header h1 i { color: #6c5ce7; margin-right: 8px; }
        .login-header p { color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 6px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 500; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 14px 16px; border: 1.5px solid rgba(255,255,255,0.15); border-radius: 16px; background: rgba(255,255,255,0.06); color: #fff; font-size: 15px; outline: none; transition: all 0.3s; }
        .form-group input::placeholder { color: rgba(255,255,255,0.3); }
        .form-group input:focus { border-color: #6c5ce7; background: rgba(255,255,255,0.08); box-shadow: 0 0 0 4px rgba(108,92,231,0.15); }
        .login-btn { width: 100%; padding: 14px; background: #6c5ce7; border: none; border-radius: 16px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.25s, transform 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .login-btn:hover { background: #5a4bd1; transform: translateY(-2px); }
        .login-btn:active { transform: scale(0.97); }
        .login-footer { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.3); font-size: 13px; }
        .error-msg { background: rgba(225,112,85,0.2); border-left: 3px solid #e17055; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; color: #e17055; font-size: 14px; display: none; }
        .error-msg.show { display: block; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) { .login-container { padding: 32px 24px; margin: 0 16px; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1><i class="fas fa-newspaper"></i> NewsBlog</h1>
            <p>Đăng nhập để tiếp tục</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Mật khẩu</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="login-btn" id="loginBtn">
                <span id="btnText">Đăng nhập</span>
            </button>
            <div class="error-msg" id="errorMsg"></div>
        </form>

        <div class="login-footer">
            Quản trị viên liên hệ hỗ trợ
        </div>
    </div>

    <!-- Firebase SDK compat (chỉ Auth, không Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAcsjZmPrUDxnaUA1nzCGiE9M-3fUM2rRk",
            authDomain: "blogevents-8977c.firebaseapp.com",
            projectId: "blogevents-8977c",
            storageBucket: "blogevents-8977c.firebasestorage.app",
            messagingSenderId: "353511561806",
            appId: "1:353511561806:web:ffaab4fd78d66b8437c11f"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // SESSION persistence – không lưu tự động
        auth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
            .catch(err => console.warn('Persistence error:', err));

        // DOM
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const errorMsg = document.getElementById('errorMsg');

        function setError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = msg ? 'block' : 'none';
        }

        function setLoading(loading) {
            loginBtn.disabled = loading;
            btnText.innerHTML = loading ? '<span class="spinner"></span> Đang đăng nhập...' : 'Đăng nhập';
        }

        // Xử lý đăng nhập
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            setError('');
            setLoading(true);

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Lấy tên hiển thị (nếu có) hoặc dùng email
                const displayName = user.displayName || email.split('@')[0];
                const photoURL = user.photoURL || '';

                // Lưu vào localStorage
                localStorage.setItem('user', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    displayName: displayName,
                    photoURL: photoURL
                }));

                // Chuyển đến blog
                window.location.href = 'dangquy/index.html';

            } catch (error) {
                console.error('Login error:', error);
                let msg = 'Đăng nhập thất bại. Vui lòng kiểm tra lại.';
                if (error.code === 'auth/user-not-found') msg = 'Tài khoản không tồn tại.';
                else if (error.code === 'auth/wrong-password') msg = 'Mật khẩu không đúng.';
                else if (error.code === 'auth/invalid-email') msg = 'Email không hợp lệ.';
                else if (error.code === 'auth/too-many-requests') msg = 'Quá nhiều yêu cầu, vui lòng thử lại sau.';
                setError(msg);
                setLoading(false);
            }
        });

        // Kiểm tra localStorage khi tải trang
        (function checkAlreadyLoggedIn() {
            if (localStorage.getItem('user')) {
                window.location.href = 'dangquy/index.html';
            }
        })();
    </script>
</body>
</html>
